<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Herbarium Bisma</title>
  <meta name="description" content="Bisma Prasetya: developer, pemilik server Classic Chronicles, pembuat bot. Semua tautan dalam satu lembar.">
  <meta name="theme-color" content="#c4a77a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23c4a77a'/><path d='M16 5l2.6 6.4 5.6-2.2-2 6 4.8 1.6-6 3.2.8 3.6H18v3.4h-4V23.6h-3.8l.8-3.6-6-3.2 4.8-1.6-2-6 5.6 2.2z' fill='%23a8341c'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Reenie+Beanie&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- Daun yang berguguran di latar (effects.js) -->
  <canvas class="fall" id="fall" aria-hidden="true"></canvas>

  <!-- Isi diisi js/render.js dari js/config.js -->
  <div class="sheet">
    <header class="collector" id="collector">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 class="name" id="name"></h1>
      <p class="hand" id="roles"></p>
      <p class="bio" id="bio"></p>
      <dl class="ledger" id="ledger"></dl>
      <p class="elsewhere" id="elsewhere"></p>
      <button class="copy" id="copy" type="button">Salin tautan halaman</button>
    </header>

    <main class="specimens" id="specimens" aria-label="Tautan"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/leaves.js"></script>
  <script src="js/render.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
